[project]
name = "SqlServer.OpsAgent"
version = "0.1.0"
description = "First-pass triage for SQL Server incidents. Give it an alert; it investigates with read-only diagnostics and writes an evidence-backed diagnosis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "claude-agent-sdk>=0.2.174",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "opsagent"
module-root = ""

[tool.mypy]
strict = true
files = ["opsagent", "spikes"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
